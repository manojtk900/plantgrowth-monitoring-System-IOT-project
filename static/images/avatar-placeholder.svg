<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2419" />
      <stop offset="50%" stop-color="#153828" />
      <stop offset="100%" stop-color="#2a6349" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Outer Border Ring -->
  <circle cx="120" cy="120" r="116" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Background Pattern -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Stylized Developer Monogram / Icon -->
  <g transform="translate(120, 110)">
    <!-- Monogram MT -->
    <text x="0" y="8" font-family="'Outfit', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">MT</text>
  </g>

  <!-- Engineering Tagline Badge -->
  <g transform="translate(120, 172)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2" />
    <text x="0" y="4" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">DEV • AI • IOT</text>
  </g>

  <!-- Accent Status Dot (Online) -->
  <circle cx="180" cy="58" r="9" fill="#10b981" stroke="#0c2419" stroke-width="3" />
</svg>
